<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DeepShield — Sign In</title>
<link rel="stylesheet" href="/static/css/design-system.css"/>
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
.auth-container { width:100%; max-width:440px; }
.auth-logo { text-align:center; margin-bottom:2rem; }
.auth-logo h1 { font-size:2rem; }
.auth-logo p  { color:var(--text-muted); font-size:.9rem; margin-top:.25rem; }

.auth-card { padding:2rem; }

/* Tabs */
.tabs { display:flex; background:var(--bg-surface); border-radius:var(--radius-md); padding:4px; margin-bottom:1.5rem; }
.tab-btn {
  flex:1; padding:.55rem; border:none; background:transparent;
  color:var(--text-muted); font-family:'Inter',sans-serif; font-weight:600;
  border-radius:var(--radius-sm); cursor:pointer; transition:all .2s;
}
.tab-btn.active { background:var(--bg-elevated); color:var(--text-primary); box-shadow:0 2px 8px rgba(0,0,0,0.3); }

.tab-panel { display:none; }
.tab-panel.active { display:flex; flex-direction:column; gap:1rem; }

.auth-footer { text-align:center; margin-top:1.25rem; font-size:.85rem; color:var(--text-muted); }

/* Animated gradient border on focus */
.form-input:focus { border-color:var(--cyan); }

/* Glow orbs */
.orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:-1; }
.orb1 { width:300px;height:300px;background:rgba(124,58,237,.12);top:-60px;left:-60px; }
.orb2 { width:250px;height:250px;background:rgba(0,212,255,.08);bottom:-40px;right:-40px; }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="auth-container">
  <div class="auth-logo">
    <div style="font-size:3rem;margin-bottom:.5rem;">🛡️</div>
    <h1><span class="text-cyan">Deep</span>Shield</h1>
    <p>Intelligent Synthetic Media Detector</p>
  </div>

  <div class="card auth-card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Sign In</button>
      <button class="tab-btn"        data-tab="register">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div class="tab-panel active" id="tab-login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="login-email" class="form-input" type="email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="login-password" class="form-input" type="password" placeholder="••••••••"/>
      </div>
      <button id="login-btn" class="btn btn--primary w-full" style="margin-top:.5rem;">
        Sign In
      </button>
    </div>

    <!-- REGISTER -->
    <div class="tab-panel" id="tab-register">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input id="reg-name" class="form-input" type="text" placeholder="Aakash Juluru"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="reg-email" class="form-input" type="email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="reg-password" class="form-input" type="password" placeholder="Min. 6 characters"/>
      </div>
      <button id="register-btn" class="btn btn--primary w-full" style="margin-top:.5rem;">
        Create Account
      </button>
    </div>

    <div class="auth-footer">
      By continuing you agree to our terms of service.
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/api.js"></script>
<script>
// Redirect if already logged in
if(Auth.isLoggedIn()) window.location.href='/dashboard.html';

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn,.tab-panel').forEach(el=>el.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

function setLoading(btn, loading) {
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="spinner"></span> Please wait...'
    : btn.dataset.label;
}

// Login
const loginBtn = document.getElementById('login-btn');
loginBtn.dataset.label = 'Sign In';
loginBtn.addEventListener('click', async () => {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if(!email || !password) { toast('Please fill in all fields', 'warning'); return; }

  setLoading(loginBtn, true);
  try {
    const data = await api('/auth/login', {
      method:'POST',
      body: JSON.stringify({email, password})
    });
    Auth.setSession(data.access_token, data.user);
    toast('Welcome back, '+data.user.name+'!', 'success');
    setTimeout(()=> window.location.href='/dashboard.html', 700);
  } catch(e) {
    toast(e.message || 'Login failed', 'error');
    setLoading(loginBtn, false);
  }
});

// Register
const regBtn = document.getElementById('register-btn');
regBtn.dataset.label = 'Create Account';
regBtn.addEventListener('click', async () => {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if(!name||!email||!password) { toast('Please fill in all fields','warning'); return; }
  if(password.length < 6) { toast('Password must be at least 6 characters','warning'); return; }

  setLoading(regBtn, true);
  try {
    const data = await api('/auth/register', {
      method:'POST',
      body: JSON.stringify({name, email, password})
    });
    Auth.setSession(data.access_token, data.user);
    toast('Account created! Welcome, '+data.user.name, 'success');
    setTimeout(()=> window.location.href='/dashboard.html', 700);
  } catch(e) {
    toast(e.message || 'Registration failed', 'error');
    setLoading(regBtn, false);
  }
});

// Enter key support
document.addEventListener('keydown', e => {
  if(e.key==='Enter') {
    const active = document.querySelector('.tab-btn.active').dataset.tab;
    document.getElementById(active==='login'?'login-btn':'register-btn').click();
  }
});
</script>
</body>
</html>
